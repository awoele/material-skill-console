<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>素材工作流设计样例｜公开版</title>
  <style>
    :root{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--line:#34383e;--text:#f0f1ee;--muted:#a8adb2;--accent:#ff6b38}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 82% 10%,#3f271f,transparent 31rem),var(--bg);font:16px/1.7 Inter,"Microsoft YaHei",sans-serif}.page{width:min(100% - 40px,1020px);margin:auto;padding:76px 0}.eyebrow{color:var(--accent);font:700 12px/1 ui-monospace,monospace;letter-spacing:.12em}h1{margin:16px 0;font-size:clamp(42px,7vw,76px);line-height:1.04;letter-spacing:-.06em}.intro{max-width:720px;color:var(--muted);font-size:20px}.notice{margin:36px 0;padding:16px 18px;color:#f2d2c6;background:#2a1e1a;border:1px solid #704434}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.card b{color:var(--accent);font:700 12px/1 ui-monospace,monospace}.card h2{margin:26px 0 8px;font-size:24px}.card p{margin:0;color:var(--muted)}footer{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);color:#818991;font-size:13px}@media(max-width:700px){.page{width:min(100% - 32px,1020px);padding:48px 0}.grid{grid-template-columns:1fr}.intro{font-size:18px}}
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">PUBLIC PORTFOLIO SAMPLE · 05</p>
    <h1>素材工作流<br>设计样例</h1>
    <p class="intro">展示将素材需求整理为可确认、可交付工作流的产品设计思路；这是不连接任何本地服务的公开演示页面。</p>
    <aside class="notice">公开作品集版本：已移除运行入口、本地接口、任务记录、素材清单、身份凭证和任何项目配置。</aside>
    <section class="grid" aria-label="工作流设计">
      <article class="card"><b>01 / INTAKE</b><h2>澄清需求</h2><p>归纳交付目标、素材范围与需要确认的前置条件。</p></article>
      <article class="card"><b>02 / REVIEW</b><h2>组织校验</h2><p>让制作清单、质量标准和风险提示在执行前可见。</p></article>
      <article class="card"><b>03 / DELIVERY</b><h2>完成交付</h2><p>以清晰的状态、结果与说明收束工作流程。</p></article>
    </section>
    <footer>本页不请求 API，不展示任何业务资产、账号、令牌或运行数据。</footer>
  </main>
</body>
</html>
